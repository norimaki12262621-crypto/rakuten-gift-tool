<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽天ギフトランキング | プレゼント迷子救済隊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #C8102E;
  --red-dark: #8B0A1E;
  --gold: #C9A84C;
  --cream: #FBF6EE;
  --ink: #1A1209;
  --ink2: #3D2E1A;
  --smoke: #F2EDE6;
  --border: rgba(201,168,76,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); }

.header { background: var(--ink); padding: 24px 20px 18px; text-align: center; border-bottom: 2px solid var(--gold); }
.header-sub { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 6px; }
.header-title { font-family: 'Noto Serif JP', serif; font-size: 20px; color: #fff; font-weight: 700; }
.header-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 5px; }

.panel { background: #fff; padding: 16px; border-bottom: 1px solid var(--border); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
label { display: block; font-size: 10px; color: var(--ink2); font-weight: 700; letter-spacing: 0.06em; margin-bottom: 4px; }
select { width: 100%; border: 1px solid #D9D3CA; border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); appearance: none; outline: none; }
select:focus { border-color: var(--gold); }

.btn { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; letter-spacing: 0.08em; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--red-dark); }
.btn:disabled { background: #aaa; cursor: not-allowed; }

.stats { display: none; background: var(--ink); padding: 10px 16px; }
.stats.on { display: flex; }
.stat { flex: 1; text-align: center; border-right: 1px solid rgba(201,168,76,0.2); }
.stat:last-child { border: none; }
.stat-n { font-size: 17px; font-weight: 700; color: var(--gold); font-family: 'Noto Serif JP', serif; }
.stat-l { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 1px; }

.area { padding: 14px 14px 80px; }
.sec-title { font-size: 11px; letter-spacing: 0.2em; color: var(--red); font-weight: 700; text-align: center; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.sec-title::before, .sec-title::after { content:''; flex:1; height:1px; background: var(--border); }

.card { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 16px rgba(26,18,9,0.07); }
.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.badge { min-width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.b1 { background: linear-gradient(135deg,#C9A84C,#F0D080); color: #3D2E1A; }
.b2 { background: linear-gradient(135deg,#A8A8A8,#D8D8D8); color: #333; }
.b3 { background: linear-gradient(135deg,#CD7F32,#E8A060); color: #fff; }
.b4,.b5 { background: var(--smoke); color: var(--ink2); }
.card-title-area { flex: 1; min-width: 0; }
.rank-lbl { font-size: 10px; color: var(--red); letter-spacing: 0.1em; font-weight: 700; }
.pname { font-size: 14px; font-weight: 700; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pimg { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--smoke); }
.pimg-ph { width: 60px; height: 60px; border-radius: 8px; background: var(--smoke); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }

.card-body { padding: 12px 14px 14px; }
.price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.price { font-size: 20px; font-weight: 700; color: var(--red); font-family: 'Noto Serif JP', serif; }
.price-lbl { font-size: 11px; color: #999; }
.ok-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; background: #E8F8F0; color: #27AE60; }
.review { font-size: 12px; color: #888; margin-bottom: 8px; }
.stars { color: var(--gold); }

.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.score-lbl { font-size: 10px; color: #999; width: 56px; flex-shrink: 0; }
.bar-wrap { flex: 1; height: 5px; background: #EEE; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(to right, var(--gold), var(--red)); }
.score-val { font-size: 11px; font-weight: 700; color: var(--ink2); min-width: 26px; text-align: right; }

.point-box { background: var(--smoke); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; padding: 8px 12px; font-size: 13px; color: var(--ink2); font-weight: 500; margin-bottom: 10px; line-height: 1.5; }
.quote { font-size: 12px; color: #777; font-style: italic; margin-bottom: 12px; padding-left: 8px; border-left: 2px solid #ddd; line-height: 1.6; }

.kw-lbl { font-size: 10px; color: var(--ink2); letter-spacing: 0.06em; font-weight: 700; margin-bottom: 4px; }
.kw-box { display: flex; align-items: center; gap: 8px; background: #FBF6EE; border: 1px dashed var(--gold); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.kw-text { flex: 1; font-size: 12px; color: var(--ink); font-weight: 500; word-break: break-all; }
.cp-btn { flex-shrink: 0; font-size: 11px; padding: 4px 10px; border: 1px solid var(--gold); border-radius: 4px; background: transparent; color: var(--gold); cursor: pointer; font-family: 'Zen Kaku Gothic New', sans-serif; white-space: nowrap; transition: all 0.15s; }
.cp-btn:hover { background: var(--gold); color: #fff; }
.cp-btn.done { background: #27AE60; border-color: #27AE60; color: #fff; }

.hint { font-size: 11px; color: #999; margin-bottom: 10px; line-height: 1.6; }
.aff-url { font-size: 10px; color: #aaa; word-break: break-all; }

.sns-btn { width: 100%; background: var(--ink); color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 10px; font-size: 12px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; margin-top: 4px; }
.sns-btn:hover { background: var(--gold); color: var(--ink); }

.empty { text-align: center; padding: 40px 16px; color: #bbb; }
.spinner { width: 34px; height: 34px; border: 3px solid #e8e0d4; border-top-color: var(--red); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.err { background: #FEE; border: 1px solid #F5C6C6; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--red-dark); margin-bottom: 10px; display: none; }
.err.on { display: block; }

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; overflow-y: auto; padding: 20px; }
.modal-bg.on { display: block; }
.modal { background: #fff; border-radius: 12px; max-width: 460px; margin: 0 auto; overflow: hidden; }
.modal-head { background: var(--ink); color: var(--gold); padding: 14px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; }
.modal-body { padding: 14px 18px 18px; }
textarea { width: 100%; height: 340px; font-size: 12px; font-family: monospace; border: 1px solid #ddd; border-radius: 6px; padding: 10px; resize: none; color: var(--ink); background: var(--cream); line-height: 1.7; margin-bottom: 10px; }
.copy-all { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">Rakuten API · Real Products Only</div>
  <div class="header-title">楽天ギフトランキング自動選定</div>
  <div class="header-desc">架空商品・リンク切れを100%排除 — 実在商品のみ取得</div>
</div>

<div class="panel">
  <div class="grid2">
    <div>
      <label>ジャンル</label>
      <select id="genre">
        <option value="母の日 プレゼント 女性 ギフト">すべて（母の日ギフト）</option>
        <option value="母の日 コスメ スキンケア ギフト">コスメ・スキンケア</option>
        <option value="母の日 スイーツ お菓子 ギフト">スイーツ・お菓子</option>
        <option value="母の日 紅茶 ティー ギフト">紅茶・ティー</option>
        <option value="母の日 入浴剤 バスギフト">入浴剤・バスギフト</option>
        <option value="母の日 グルメ 食品 ギフト">グルメ・食品</option>
        <option value="母の日 ハンドクリーム ハンドケア">ハンドケア</option>
        <option value="母の日 アロマ リラックス ギフト">アロマ・リラックス</option>
        <option value="誕生日 プレゼント 女性 30代 ギフト">誕生日（30代女性）</option>
        <option value="誕生日 プレゼント 女性 40代 ギフト">誕生日（40代女性）</option>
        <option value="誕生日 プレゼント 女性 50代 ギフト">誕生日（50代女性）</option>
        <option value="クリスマス プレゼント 女性 ギフト">クリスマス</option>
      </select>
    </div>
    <div>
      <label>価格帯</label>
      <select id="price">
        <option value="3000:7000">3,000〜7,000円（推奨）</option>
        <option value="2000:5000">2,000〜5,000円</option>
        <option value="3000:5000">3,000〜5,000円</option>
        <option value="5000:10000">5,000〜10,000円</option>
      </select>
    </div>
  </div>
  <div class="grid3">
    <div>
      <label>並び順</label>
      <select id="sort">
        <option value="-reviewCount">レビュー数順</option>
        <option value="-reviewAverage">評価順</option>
        <option value="standard">楽天おすすめ</option>
      </select>
    </div>
    <div>
      <label>最低評価</label>
      <select id="minAvg">
        <option value="3.5">★3.5以上</option>
        <option value="4.0">★4.0以上</option>
        <option value="4.5">★4.5以上</option>
        <option value="0">指定なし</option>
      </select>
    </div>
    <div>
      <label>最低レビュー数</label>
      <select id="minCnt">
        <option value="50">50件以上</option>
        <option value="100">100件以上</option>
        <option value="20">20件以上</option>
        <option value="0">指定なし</option>
      </select>
    </div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" id="searchBtn" onclick="run()">▶ 楽天APIで実商品ランキングを生成</button>
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="stat-n" id="sTotal">—</div><div class="stat-l">API取得</div></div>
  <div class="stat"><div class="stat-n" id="sValid">—</div><div class="stat-l">検証通過</div></div>
  <div class="stat"><div class="stat-n" id="sScore">—</div><div class="stat-l">平均スコア</div></div>
  <div class="stat"><div class="stat-n" id="sPrice">—</div><div class="stat-l">平均価格</div></div>
</div>

<div class="area" id="area">
  <div class="empty"><div style="font-size:36px;margin-bottom:10px">🎁</div>条件を選んでボタンを押してください<br><small style="font-size:11px">楽天APIで実在商品のみ取得します</small></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head">
      <span>SNS投稿テキスト（コピペ即使用）</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <textarea id="snsText" readonly></textarea>
      <button class="copy-all" onclick="copyAll()">📋 全文コピー</button>
    </div>
  </div>
</div>

<script>
const APP_ID = '9a9bb16b-a393-414a-ad63-ea58ecf01daa';
const AFF_ID = '534cdfaf.e35a1702.534cdfb0.c0ce9a58';
const EXCLUDE = ['洗剤','掃除','電気','テレビ','パソコン','家電','充電','ケーブル'];
const QUOTES = ['「母に贈ったら大喜びでした」','「箱もきれいでそのまま渡せた」','「思ったより高見えしてびっくり」','「毎年リピートしています」','「上品な香りで喜んでもらえました」','「ギフト包装が丁寧で感動しました」'];
const ICONS = ['','🥇','🥈','🥉','4️⃣','5️⃣'];
let ranking = [];

function score(item, minAvg, minCnt) {
  const avg = parseFloat(item.reviewAverage)||0;
  const cnt = parseInt(item.reviewCount)||0;
  if (avg < parseFloat(minAvg)) return -1;
  if (cnt < parseInt(minCnt)) return -1;
  if (!item.itemUrl) return -1;
  const n = item.itemName.toLowerCase();
  for (const kw of EXCLUDE) if (n.includes(kw)) return -1;
  let s = avg*18 + Math.min(cnt/8,22);
  const price = parseInt(item.itemPrice)||0;
  if (price>=3000&&price<=7000) s+=15;
  const gkws = ['ギフト','プレゼント','贈り物','セット','母の日','ボックス'];
  for (const kw of gkws) if (item.itemName.includes(kw)||(item.itemCaption&&item.itemCaption.includes(kw))) { s+=5; break; }
  if (item.itemCaption&&item.itemCaption.includes('送料無料')) s+=5;
  return Math.round(s);
}

function affUrl(url) {
  return `https://hb.afl.rakuten.co.jp/hgc/${AFF_ID}/?pc=${encodeURIComponent(url)}&m=${encodeURIComponent(url)}`;
}

function stars(avg) {
  const f=Math.floor(avg), h=avg-f>=0.5?1:0, e=5-f-h;
  return '★'.repeat(f)+(h?'☆':'')+'☆'.repeat(e);
}

function keyword(item) {
  let n = item.itemName.replace(/【[^】]*】/g,'').replace(/\([^)]*\)/g,'').trim();
  const ws = n.split(/[\s　]/);
  let kw='';
  for (const w of ws) { if ((kw+' '+w).trim().length<=22) kw=(kw+' '+w).trim(); else break; }
  return kw||n.substring(0,20);
}

function point(item) {
  const avg=parseFloat(item.reviewAverage)||0, cnt=parseInt(item.reviewCount)||0, p=parseInt(item.itemPrice);
  if (avg>=4.5) return `評価${avg}超！口コミ${cnt}件の人気品`;
  if (cnt>=500) return `レビュー${cnt.toLocaleString()}件の超定番ギフト`;
  if (p<=4000) return `${p.toLocaleString()}円で豪華見えするギフト`;
  return `上品な贈り物として喜ばれる一品`;
}

function card(item, rank, sc) {
  const aff = affUrl(item.itemUrl);
  const price = parseInt(item.itemPrice);
  const avg = parseFloat(item.reviewAverage)||0;
  const cnt = parseInt(item.reviewCount)||0;
  const kw = keyword(item);
  const sn = Math.min(100,sc);
  const medImg = item.mediumImageUrls&&item.mediumImageUrls[0] ? (item.mediumImageUrls[0].imageUrl || item.mediumImageUrls[0]) : null;
  const cleanImg = item.mediumImageUrls ? item.mediumImageUrls.find(img=>{const u=img.imageUrl||img; return u.includes(`/0_mall/`);}) : null;
  const bestImg = cleanImg ? (cleanImg.imageUrl||cleanImg) : medImg;
  const imgHtml = medImg
    ? `<img class="pimg" src="${medImg}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="pimg-ph">🎁</div>`;
  const q = QUOTES[Math.min(Math.floor(avg-3), QUOTES.length-1)] || QUOTES[0];

  return `<div class="card">
  <div class="card-head">
    <div class="badge b${rank}">${rank}</div>
    <div class="card-title-area">
      <div class="rank-lbl">${ICONS[rank]} ${rank}位 〈スコア${sn}〉</div>
      <div class="pname">${item.itemName}</div>
    </div>
    ${imgHtml}
  </div>
  <div class="card-body">
    <div class="price-row">
      <span class="price">¥${price.toLocaleString()}</span>
      <span class="price-lbl">税込</span>
      <span class="ok-badge">✓ 実在確認済</span>
    </div>
    ${avg>0?`<div class="review"><span class="stars">${stars(avg)}</span> ${avg.toFixed(1)} | ${cnt.toLocaleString()}件</div>`:''}
    <div class="score-row">
      <span class="score-lbl">選定スコア</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${sn}%"></div></div>
      <span class="score-val">${sn}</span>
    </div>
    <div class="point-box">💡 ${point(item)}</div>
    <div class="quote">${q}</div><div class="quote" style="margin-top:4px;border-left-color:#C8102E;">「プレゼントしたら即LINEで感謝が来た」</div>
    <div class="kw-lbl">📋 楽天検索キーワード（コピペ用）</div>
    <div class="kw-box">
      <span class="kw-text">${kw}</span>
      <button class="cp-btn" onclick="cp('${kw.replace(/'/g,"\\'")}',this)">コピー</button>
    </div>
    <div class="hint">🔍 「${item.shopName?item.shopName.substring(0,12):''}」を出品ショップで絞り込み / 価格：¥${price.toLocaleString()}付近</div>
    <div class="kw-lbl">🔗 アフィリエイトURL（楽天ルーム用）</div>
    <div class="kw-box">
      <span class="kw-text aff-url">${aff.substring(0,55)}...</span>
      <button class="cp-btn" onclick="cp('${aff.replace(/'/g,"\\'")}',this)">コピー</button>
    </div>
    ${bestImg||medImg ? `
    <div class="kw-lbl" style="margin-top:10px;">📸 商品画像（長押しで保存 → ChatGPTに添付）</div>
    <div style="text-align:center;margin:6px 0 4px;">
      <img src="${bestImg||medImg}" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid #e8e0d4;background:#f9f5ee;" alt="商品画像" onerror="this.style.display='none'">
    </div>
    <div style="font-size:10px;color:#aaa;text-align:center;margin-bottom:8px;">※白背景優先で選択しています</div>     <button class="cp-btn" style="width:100%;margin-top:6px;background:#1a1a2e;color:#4CAF50;border-color:#4CAF50;" onclick="cp(\`【${rank}位】
商品名（楽天表記）：${item.itemName.substring(0,40)}
価格：¥${price.toLocaleString()}前後（税込）
口コミ①：${q}
口コミ②：${genReview2(item)}
ポイント：${point(item)}
検索ワード：${keyword(item)}
商品画像：[添付してください]

※商品名は10文字以内で簡潔な名前に変換してから画像に使用してください
※商品画像内のテキスト・バナー・ポイント表記は無視して商品本体のみを参考にしてください
※商品画像内のテキスト・バナー・ポイント表記は無視して商品本体のみを参考にしてください\`,this)">📋 ChatGPT用データをコピー</button</div>` : ''}
  </div>
</div>`;
}

async function run() {
  const btn = document.getElementById('searchBtn');
  const err = document.getElementById('err');
  const stats = document.getElementById('stats');
  const area = document.getElementById('area');
  const genre = document.getElementById('genre').value;
  const [minP,maxP] = document.getElementById('price').value.split(':');
  const sort = document.getElementById('sort').value;
  const minAvg = document.getElementById('minAvg').value;
  const minCnt = document.getElementById('minCnt').value;

  btn.disabled=true; btn.textContent='🔍 取得中...';
  err.classList.remove('on'); stats.classList.remove('on');
  area.innerHTML='<div class="empty"><div class="spinner"></div>楽天APIで実商品を取得・検証中...</div>';

  try {
    const params = new URLSearchParams({
      applicationId: APP_ID,
      affiliateId: AFF_ID,
      keyword: genre,
      hits: 30,
      minPrice: minP,
      maxPrice: maxP,
      sort: sort,
      formatVersion: 2,
      imageFlag: 1
    });
    const res = await fetch(`/api/rakuten?${params}`);
    if (!res.ok) throw new Error(`サーバーエラー (${res.status})`);
    const data = await res.json();
    if (data.error) throw new Error(data.error_description||data.error);

    const rawItems = data.Items||[];
    const items = rawItems.map(i => i.Item || i);
    if (!items.length) throw new Error('該当商品がありません。条件を変えてください。');

    const scored = items
      .map(i=>({item:i,sc:score(i,minAvg,minCnt)}))
      .filter(x=>x.sc>0)
      .sort((a,b)=>b.sc-a.sc)
      .filter((x,i,self)=>self.findIndex(y=>y.item.shopCode===x.item.shopCode)===i).slice(0,5);

    if (scored.length<2) throw new Error(`バリデーション通過が${scored.length}件のみです。最低評価・レビュー数の条件を緩めてください。`);

    ranking = scored;
    const avgSc = Math.round(scored.reduce((s,x)=>s+x.sc,0)/scored.length);
    const avgPr = Math.round(scored.reduce((s,x)=>s+parseInt(x.item.itemPrice),0)/scored.length);
    document.getElementById('sTotal').textContent = items.length;
    document.getElementById('sValid').textContent = scored.length;
    document.getElementById('sScore').textContent = avgSc;
    document.getElementById('sPrice').textContent = '¥'+avgPr.toLocaleString();
    stats.classList.add('on');

    const rev = [...scored].reverse();
    let html = `<div class="sec-title">SNS用 ギフトランキング TOP${scored.length}</div>`;
    rev.forEach((x,i)=>{ html += card(x.item, scored.length-i, x.sc); });
    html += `<button class="sns-btn" onclick="openModal()">📱 SNS投稿テキストを一括生成</button>`;
    area.innerHTML = html;

  } catch(e) {
    err.textContent = '⚠️ '+e.message;
    err.classList.add('on');
    area.innerHTML = `<div class="empty">⚠️ ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='▶ 楽天APIで実商品ランキングを生成';
}

function cp(text, btn) {
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓ コピー済'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('done'); },1800);
  }).catch(()=>{
    const el=document.createElement('textarea'); el.value=text;
    document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    btn.textContent='✓ コピー済'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('done'); },1800);
  });
}

function openModal() {
  if (!ranking.length) return;
  const genre = document.getElementById('genre').options[document.getElementById('genre').selectedIndex].text;
  let t = `🎁 母の日プレゼントおすすめランキング\n（${genre}）\n━━━━━━━━━━━━━━━━\n\n`;
  [...ranking].reverse().forEach((x,i)=>{
    const rank=ranking.length-i, item=x.item, price=parseInt(item.itemPrice);
    t+=`【${rank}位】${ICONS[rank]}\n${item.itemName.substring(0,28)}...\n💰 ¥${price.toLocaleString()}（税込）\n💡 ${point(item)}\n🔍 楽天検索：「${keyword(item)}」\n\n`;
  });
  t+=`━━━━━━━━━━━━━━━━\n詳細・購入リンクはプロフのリンクから👆\n#母の日 #プレゼント #ギフト #楽天 #楽天ルーム\n#プレゼント迷子救済隊 #女性へのプレゼント`;
  document.getElementById('snsText').value=t;
  document.getElementById('modal').classList.add('on');
}
function closeModal() { document.getElementById('modal').classList.remove('on'); }
function copyAll() {
  const t=document.getElementById('snsText').value;
  cp(t, document.querySelector('.copy-all'));
  document.querySelector('.copy-all').textContent='✓ コピーしました！';
  setTimeout(()=>{ document.querySelector('.copy-all').textContent='📋 全文コピー'; },2000);
}
</script>
