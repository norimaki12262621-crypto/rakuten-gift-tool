<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楽天ギフトランキング | プレゼント迷子救済隊</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #C8102E;
  --red-dark: #8B0A1E;
  --gold: #C9A84C;
  --cream: #FBF6EE;
  --ink: #1A1209;
  --ink2: #3D2E1A;
  --smoke: #F2EDE6;
  --border: rgba(201,168,76,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); }

.header { background: var(--ink); padding: 24px 20px 18px; text-align: center; border-bottom: 2px solid var(--gold); }
.header-sub { font-size: 10px; letter-spacing: 0.3em; color: var(--gold); margin-bottom: 6px; }
.header-title { font-family: 'Noto Serif JP', serif; font-size: 20px; color: #fff; font-weight: 700; }
.header-desc { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 5px; }

.panel { background: #fff; padding: 16px; border-bottom: 1px solid var(--border); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
label { display: block; font-size: 10px; color: var(--ink2); font-weight: 700; letter-spacing: 0.06em; margin-bottom: 4px; }
select { width: 100%; border: 1px solid #D9D3CA; border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); appearance: none; outline: none; }
select:focus { border-color: var(--gold); }
input[type=text] { width: 100%; border: 1px solid #D9D3CA; border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); outline: none; }
input[type=text]:focus { border-color: var(--gold); }

.btn { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; letter-spacing: 0.08em; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--red-dark); }
.btn:disabled { background: #aaa; cursor: not-allowed; }

.stats { display: none; background: var(--ink); padding: 10px 16px; }
.stats.on { display: flex; }
.stat { flex: 1; text-align: center; border-right: 1px solid rgba(201,168,76,0.2); }
.stat:last-child { border: none; }
.stat-n { font-size: 17px; font-weight: 700; color: var(--gold); font-family: 'Noto Serif JP', serif; }
.stat-l { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 1px; }

.area { padding: 14px 14px 80px; }
.sec-title { font-size: 11px; letter-spacing: 0.2em; color: var(--red); font-weight: 700; text-align: center; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.sec-title::before, .sec-title::after { content:''; flex:1; height:1px; background: var(--border); }

.card { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 2px 16px rgba(26,18,9,0.07); }
.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.badge { min-width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.b1 { background: linear-gradient(135deg,#C9A84C,#F0D080); color: #3D2E1A; }
.b2 { background: linear-gradient(135deg,#A8A8A8,#D8D8D8); color: #333; }
.b3 { background: linear-gradient(135deg,#CD7F32,#E8A060); color: #fff; }
.b4,.b5 { background: var(--smoke); color: var(--ink2); }
.card-title-area { flex: 1; min-width: 0; }
.rank-lbl { font-size: 10px; color: var(--red); letter-spacing: 0.1em; font-weight: 700; }
.pname { font-size: 14px; font-weight: 700; line-height: 1.4; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pimg { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--smoke); }
.pimg-ph { width: 60px; height: 60px; border-radius: 8px; background: var(--smoke); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }

.card-body { padding: 12px 14px 14px; }
.price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.price { font-size: 20px; font-weight: 700; color: var(--red); font-family: 'Noto Serif JP', serif; }
.price-lbl { font-size: 11px; color: #999; }
.ok-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700; background: #E8F8F0; color: #27AE60; }
.review { font-size: 12px; color: #888; margin-bottom: 8px; }
.stars { color: var(--gold); }

.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.score-lbl { font-size: 10px; color: #999; width: 56px; flex-shrink: 0; }
.bar-wrap { flex: 1; height: 5px; background: #EEE; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(to right, var(--gold), var(--red)); }
.score-val { font-size: 11px; font-weight: 700; color: var(--ink2); min-width: 26px; text-align: right; }

.point-box { background: var(--smoke); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; padding: 8px 12px; font-size: 13px; color: var(--ink2); font-weight: 500; margin-bottom: 10px; line-height: 1.5; }

.kw-lbl { font-size: 10px; color: var(--ink2); letter-spacing: 0.06em; font-weight: 700; margin-bottom: 4px; }
.kw-box { display: flex; align-items: center; gap: 8px; background: #FBF6EE; border: 1px dashed var(--gold); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.kw-text { flex: 1; font-size: 12px; color: var(--ink); font-weight: 500; word-break: break-all; }
.cp-btn { flex-shrink: 0; font-size: 11px; padding: 4px 10px; border: 1px solid var(--gold); border-radius: 4px; background: transparent; color: var(--gold); cursor: pointer; font-family: 'Zen Kaku Gothic New', sans-serif; white-space: nowrap; transition: all 0.15s; }
.cp-btn:hover { background: var(--gold); color: #fff; }
.cp-btn.done { background: #27AE60; border-color: #27AE60; color: #fff; }

.hint { font-size: 11px; color: #999; margin-bottom: 10px; line-height: 1.6; }
.aff-url { font-size: 10px; color: #aaa; word-break: break-all; }

.sns-btn { width: 100%; background: var(--ink); color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 10px; font-size: 12px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; margin-top: 4px; }
.sns-btn:hover { background: var(--gold); color: var(--ink); }

.empty { text-align: center; padding: 40px 16px; color: #bbb; }
.spinner { width: 34px; height: 34px; border: 3px solid #e8e0d4; border-top-color: var(--red); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.err { background: #FEE; border: 1px solid #F5C6C6; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--red-dark); margin-bottom: 10px; display: none; }
.err.on { display: block; }

.kw-search-panel { background: #fff; padding: 14px 16px 16px; border-bottom: 1px solid var(--border); }
.kw-search-title { font-size: 10px; letter-spacing: 0.15em; color: var(--ink2); font-weight: 700; margin-bottom: 8px; }
.kw-search-row { display: flex; gap: 8px; }
.kw-search-input { flex: 1; border: 1px solid #D9D3CA; border-radius: 6px; padding: 9px 10px; font-size: 13px; font-family: 'Zen Kaku Gothic New', sans-serif; background: var(--cream); color: var(--ink); outline: none; }
.kw-search-input:focus { border-color: var(--gold); }
.kw-search-btn { background: var(--ink); color: var(--gold); border: 1px solid var(--gold); border-radius: 6px; padding: 9px 14px; font-size: 12px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.kw-search-btn:hover { background: var(--gold); color: var(--ink); }
.kw-search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kw-err { color: var(--red-dark); font-size: 12px; margin-top: 6px; display: none; }
.kw-err.on { display: block; }

.search-results { padding: 12px 14px; display: none; background: var(--smoke); border-bottom: 2px solid var(--border); }
.search-results.on { display: block; }
.search-results-title { font-size: 10px; letter-spacing: 0.2em; color: var(--red); font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.search-results-title::before, .search-results-title::after { content:''; flex:1; height:1px; background: var(--border); }
.sr-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.sr-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; background: var(--smoke); flex-shrink: 0; }
.sr-img-ph { width: 50px; height: 50px; border-radius: 6px; background: var(--smoke); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.sr-info { flex: 1; min-width: 0; }
.sr-name { font-size: 12px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 3px; }
.sr-price { font-size: 13px; font-weight: 700; color: var(--red); font-family: 'Noto Serif JP', serif; }
.sr-review { font-size: 11px; color: #888; }
.add-btn { flex-shrink: 0; background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: 12px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.add-btn:hover { background: var(--red-dark); }
.add-btn.added { background: #27AE60; }
.add-btn:disabled { background: #aaa; cursor: not-allowed; }

.card-ctrl { display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 8px 14px 0; }
.ctrl-btn { border: 1px solid #D9D3CA; border-radius: 5px; padding: 4px 10px; font-size: 12px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; background: var(--cream); color: var(--ink2); transition: all 0.15s; line-height: 1; }
.ctrl-btn:hover { border-color: var(--gold); color: var(--ink); background: #fff; }
.ctrl-del { border-color: #F5C6C6; color: var(--red-dark); background: #FEF5F5; }
.ctrl-del:hover { background: var(--red); color: #fff; border-color: var(--red); }
.fav-btn { border-color: #eee !important; color: #ccc !important; }
.fav-btn.fav-on { border-color: #ff4d6d !important; color: #ff4d6d !important; background: #fff0f3 !important; }
.fav-fab { position: fixed; bottom: 24px; right: 16px; background: #ff4d6d; color: #fff; border: none; border-radius: 24px; padding: 12px 20px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(255,77,109,0.4); z-index: 50; font-family: 'Zen Kaku Gothic New', sans-serif; }
.fav-section { display: none; background: #fff8f9; border-top: 2px solid #ff4d6d; padding: 14px 14px 80px; }
.fav-section.on { display: block; }
.fav-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.fav-section-title { font-size: 14px; font-weight: 700; color: #ff4d6d; }
.fav-clear-btn { font-size: 11px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; color: #666; font-family: 'Zen Kaku Gothic New', sans-serif; }
.fav-close-btn { font-size: 18px; background: none; border: none; cursor: pointer; color: #aaa; line-height: 1; }
.fav-card { display: flex; gap: 10px; background: #fff; border: 1px solid #f5e0e3; border-radius: 8px; padding: 10px; margin-bottom: 8px; align-items: flex-start; }
.fav-card-img { width: 60px; height: 60px; object-fit: contain; border: 1px solid #eee; border-radius: 4px; flex-shrink: 0; background: #f9f5ee; }
.fav-card-info { flex: 1; font-size: 12px; min-width: 0; }
.fav-card-name { font-weight: bold; margin-bottom: 3px; line-height: 1.4; word-break: break-all; }
.fav-card-price { color: var(--red); font-weight: bold; font-size: 13px; margin-bottom: 6px; }
.fav-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.fav-card-link { font-size: 11px; padding: 4px 10px; border: 1px solid var(--gold); border-radius: 4px; color: var(--gold); text-decoration: none; white-space: nowrap; }
.fav-card-del { font-size: 11px; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; color: #999; font-family: 'Zen Kaku Gothic New', sans-serif; }
.fav-empty { text-align: center; color: #aaa; padding: 30px; font-size: 13px; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; overflow-y: auto; padding: 20px; }
.modal-bg.on { display: block; }
.modal { background: #fff; border-radius: 12px; max-width: 460px; margin: 0 auto; overflow: hidden; }
.modal-head { background: var(--ink); color: var(--gold); padding: 14px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; line-height: 1; }
.modal-body { padding: 14px 18px 18px; }
textarea { width: 100%; height: 340px; font-size: 12px; font-family: monospace; border: 1px solid #ddd; border-radius: 6px; padding: 10px; resize: none; color: var(--ink); background: var(--cream); line-height: 1.7; margin-bottom: 10px; }
.copy-all { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 700; font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">Rakuten API · Real Products Only</div>
  <div class="header-title">楽天ギフトランキング自動選定</div>
  <div class="header-desc">架空商品・リンク切れを100%排除 — 実在商品のみ取得</div>
</div>

<div class="panel">
  <div class="grid2">
    <div>
      <label>ジャンル</label>
      <select id="genre">
        <option value="母の日 プレゼント 女性 ギフト">すべて（母の日ギフト）</option>
        <option value="母の日 コスメ スキンケア ギフト">コスメ・スキンケア</option>
        <option value="母の日 スイーツ お菓子 ギフト">スイーツ・お菓子</option>
        <option value="母の日 紅茶 ティー ギフト">紅茶・ティー</option>
        <option value="母の日 入浴剤 バスギフト">入浴剤・バスギフト</option>
        <option value="母の日 グルメ 食品 ギフト">グルメ・食品</option>
        <option value="母の日 ハンドクリーム ハンドケア">ハンドケア</option>
        <option value="母の日 アロマ リラックス ギフト">アロマ・リラックス</option>
        <option value="誕生日 プレゼント 女性 30代 ギフト">誕生日（30代女性）</option>
        <option value="誕生日 プレゼント 女性 40代 ギフト">誕生日（40代女性）</option>
        <option value="誕生日 プレゼント 女性 50代 ギフト">誕生日（50代女性）</option>
        <option value="クリスマス プレゼント 女性 ギフト">クリスマス</option>
        <optgroup label="🌞 スキンケア・美容">
          <option value="日焼け止め ランキング 人気">日焼け止め</option>
          <option value="化粧水 さっぱり 夏 ランキング">化粧水（さっぱり系）</option>
          <option value="美容液 ランキング 人気">美容液</option>
          <option value="洗顔 ランキング 人気">洗顔</option>
        </optgroup>
        <optgroup label="👒 ファッション小物">
          <option value="日傘 ランキング 人気 UVカット">日傘</option>
          <option value="帽子 UVカット ランキング 人気">帽子</option>
          <option value="サングラス ランキング 人気">サングラス</option>
        </optgroup>
        <optgroup label="❄️ リラックス・健康">
          <option value="入浴剤 夏 さっぱり ランキング">入浴剤（夏向け）</option>
          <option value="冷感グッズ ランキング 人気">冷感グッズ</option>
          <option value="虫除け ランキング 人気">虫除け</option>
        </optgroup>
        <optgroup label="🍧 グルメ・食品">
          <option value="アイス かき氷 ランキング 人気">アイス・かき氷</option>
          <option value="炭酸 冷たい飲み物 ランキング">冷たい飲み物・炭酸</option>
          <option value="そうめん 冷麺 ランキング 人気">そうめん・冷麺</option>
        </optgroup>
        <optgroup label="🏖 ライフスタイル">
          <option value="冷感タオル ランキング 人気">冷感タオル</option>
          <option value="扇風機 サーキュレーター ランキング">扇風機・サーキュレーター</option>
          <option value="アウトドア キャンプ 夏 ランキング">アウトドアグッズ</option>
        </optgroup>
        <optgroup label="🎁 イベント・季節">
          <option value="父の日 ギフト プレゼント">父の日ギフト</option>
          <option value="敬老の日 ギフト プレゼント">敬老の日ギフト</option>
          <option value="ハロウィン グッズ 人気">ハロウィングッズ</option>
          <option value="クリスマス ギフト プレゼント 人気">クリスマスギフト</option>
          <option value="お正月 お年賀 ギフト">お正月・お年賀</option>
          <option value="卒業 入学祝い プレゼント">卒業・入学祝い</option>
          <option value="就職 昇進祝い プレゼント">就職・昇進祝い</option>
          <option value="結婚記念日 ギフト プレゼント">結婚記念日ギフト</option>
          <option value="バレンタイン ギフト チョコ 人気">バレンタインギフト</option>
          <option value="ホワイトデー ギフト お返し 人気">ホワイトデーギフト</option>
        </optgroup>
        <optgroup label="🎀 可愛い雑貨">
          <option value="可愛い 収納 ケース 人気">可愛い収納・入れ物</option>
          <option value="韓国 雑貨 インテリア 人気">韓国雑貨・インテリア</option>
          <option value="おしゃれ 食器 キッチン雑貨 人気">おしゃれ食器・キッチン雑貨</option>
          <option value="推し活 グッズ 人気">推し活グッズ</option>
          <option value="ぬいぐるみ かわいい おもちゃ 人気">ぬいぐるみ・可愛いおもちゃ</option>
          <option value="フォトフレーム アルバム おしゃれ 人気">フォトフレーム・アルバム</option>
          <option value="可愛い ポーチ バッグ 人気">可愛いポーチ・バッグ</option>
          <option value="アクセサリーケース おしゃれ 人気">アクセサリーケース</option>
          <option value="おしゃれ 文房具 ステーショナリー 人気">おしゃれ文房具</option>
          <option value="スマホケース 可愛い おしゃれ 人気">可愛いスマホケース</option>
        </optgroup>
      </select>
    </div>
    <div>
      <label>価格帯</label>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="number" id="priceMin" placeholder="下限" min="0" style="width:100%;border:1px solid #D9D3CA;border-radius:6px;padding:9px 10px;font-size:13px;font-family:'Zen Kaku Gothic New',sans-serif;background:var(--cream);color:var(--ink);outline:none;">
        <span style="color:#999;font-size:12px;flex-shrink:0;">〜</span>
        <input type="number" id="priceMax" placeholder="上限" min="0" style="width:100%;border:1px solid #D9D3CA;border-radius:6px;padding:9px 10px;font-size:13px;font-family:'Zen Kaku Gothic New',sans-serif;background:var(--cream);color:var(--ink);outline:none;">
      </div>
    </div>
  </div>
  <div style="margin-bottom:10px;">
    <label>ブランド名（任意）</label>
    <input type="text" id="brand" placeholder="例: KOSE、無印良品、ニベア　※空欄ならジャンルのみで検索">
  </div>
  <div class="grid3">
    <div>
      <label>並び順</label>
      <select id="sort">
        <option value="-reviewCount">レビュー数順</option>
        <option value="-reviewAverage">評価順</option>
        <option value="standard">楽天おすすめ</option>
      </select>
    </div>
    <div>
      <label>最低評価</label>
      <select id="minAvg">
        <option value="3.5">★3.5以上</option>
        <option value="4.0">★4.0以上</option>
        <option value="4.5">★4.5以上</option>
        <option value="0">指定なし</option>
      </select>
    </div>
    <div>

<script>
const APP_ID = '9a9bb16b-a393-414a-ad63-ea58ecf01daa';
const AFF_ID = '534cdfaf.e35a1702.534cdfb0.c0ce9a58';
const EXCLUDE = ['洗剤','掃除','テレビ','パソコン','ケーブル'];
const ICONS = ['','🥇','🥈','🥉','4️⃣','5️⃣'];
let ranking = [];

function score(item, minAvg, minCnt) {
  const avg = parseFloat(item.reviewAverage)||0;
  const cnt = parseInt(item.reviewCount)||0;
  if (avg < parseFloat(minAvg)) return -1;
  if (cnt < parseInt(minCnt)) return -1;
  if (!item.itemUrl) return -1;
  const n = item.itemName.toLowerCase();
  for (const kw of EXCLUDE) if (n.includes(kw)) return -1;
  let s = avg*18 + Math.min(cnt/8,22);
  const price = parseInt(item.itemPrice)||0;
  if (price>=3000&&price<=7000) s+=15;
  return Math.round(s);
}

function affUrl(url) {
  return `https://hb.afl.rakuten.co.jp/hgc/${AFF_ID}/?pc=${encodeURIComponent(url)}&m=${encodeURIComponent(url)}`;
}

function stars(avg) {
  const f=Math.floor(avg), h=avg-f>=0.5?1:0, e=5-f-h;
  return '★'.repeat(f)+(h?'☆':'')+'☆'.repeat(e);
}

function keyword(item) {
  let n = item.itemName.replace(/【[^】]*】/g,'').replace(/\([^)]*\)/g,'').trim();
  const ws = n.split(/[\s　]/);
  let kw='';
  for (const w of ws) { if ((kw+' '+w).trim().length<=22) kw=(kw+' '+w).trim(); else break; }
  return kw||n.substring(0,20);
}

function point(item) {
  const avg=parseFloat(item.reviewAverage)||0, cnt=parseInt(item.reviewCount)||0, p=parseInt(item.itemPrice);
  if (avg>=4.5) return `評価${avg}超！口コミ${cnt}件の人気品`;
  if (cnt>=500) return `レビュー${cnt.toLocaleString()}件の超定番`;
  if (p<=4000) return `${p.toLocaleString()}円で高見えする一品`;
  return `上品な贈り物として喜ばれる一品`;
}

function genCatch(item) {
  const avg = parseFloat(item.reviewAverage) || 0;
  const cnt = parseInt(item.reviewCount) || 0;
  const price = parseInt(item.itemPrice) || 0;
  if (avg >= 4.7 && cnt >= 100) return `口コミ${cnt.toLocaleString()}件で評価${avg.toFixed(1)}！\nリアルな購入者が絶賛する本物のクオリティ✨`;
  if (avg >= 4.5 && cnt >= 50) return `★${avg.toFixed(1)}の高評価を${cnt.toLocaleString()}件獲得！\n使って実感する品質の高さが選ばれ続ける理由⭐`;
  if (cnt >= 500) return `レビュー${cnt.toLocaleString()}件超えの大ヒット商品！\nこれだけ選ばれるのには理由がある🏆`;
  if (cnt >= 100) return `${cnt.toLocaleString()}件の口コミが証明する信頼の品質！\n実際に使った人の声が背中を押してくれる💡`;
  if (price <= 3000) return `¥${price.toLocaleString()}でこの品質はコスパが異常すぎる💰\n価格を忘れさせるクオリティに驚く人続出`;
  return `品質を考えると¥${price.toLocaleString()}は実は安い。\n使えばわかる納得の価値がここにある✨`;
}

function genFeatures(item) {
  const avg = parseFloat(item.reviewAverage) || 0;
  const cnt = parseInt(item.reviewCount) || 0;
  const price = parseInt(item.itemPrice) || 0;
  const n = item.itemName;
  const lines = [];
  if (avg >= 4.5) lines.push(`・評価${avg.toFixed(1)}／5.0 — 実際の購入者がほぼ全員満足`);
  else if (avg >= 4.0) lines.push(`・評価${avg.toFixed(1)}の高評価 — 使って納得するクオリティ`);
  if (cnt >= 500) lines.push(`・レビュー${cnt.toLocaleString()}件超えが証明する圧倒的な人気`);
  else if (cnt >= 100) lines.push(`・${cnt.toLocaleString()}件の口コミで品質が証明済み`);
  else if (cnt >= 20) lines.push(`・${cnt.toLocaleString()}件のリアルな購入者レビューあり`);
  if (price <= 2000) lines.push(`・¥${price.toLocaleString()}で買えるとは思えないクオリティ`);
  else if (price <= 4000) lines.push(`・¥${price.toLocaleString()}でコスパ最強クラスの満足度`);
  else lines.push(`・品質を考えると¥${price.toLocaleString()}は妥当。むしろお得`);
  if (n.includes('花')||n.includes('フラワー')) lines.push('・見た目のインパクトが大きく、長期間楽しめる');
  else if (n.includes('スイーツ')||n.includes('お菓子')) lines.push('・美味しさと豪華な見た目で開封の瞬間から喜ばれる');
  else if (n.includes('コスメ')||n.includes('クリーム')) lines.push('・使い続けると実感できる変化が口コミでも高評価');
  else if (n.includes('入浴')||n.includes('バス')||n.includes('アロマ')) lines.push('・毎日のバスタイムが別格のリラックスタイムに変わる');
  else lines.push('・品質と価格のバランスが絶妙で満足度が高い');
  return lines.join('\n');
}

function genTags(item) {
  const n = item.itemName;
  let tags = '#プレゼント #ギフト #楽天ルーム #プレゼント迷子救済隊';
  if (n.includes('花')||n.includes('フラワー')) return tags + ' #フラワーギフト #プリザーブドフラワー';
  if (n.includes('スイーツ')||n.includes('お菓子')) return tags + ' #スイーツギフト #お菓子ギフト';
  if (n.includes('コスメ')||n.includes('クリーム')) return tags + ' #コスメギフト #スキンケアギフト';
  if (n.includes('入浴')||n.includes('バス')) return tags + ' #バスギフト #リラックスギフト';
  if (n.includes('日傘')) return tags + ' #日傘 #UVカット #夏';
  if (n.includes('日焼け止め')) return tags + ' #日焼け止め #UVケア #夏';
  if (n.includes('帽子')||n.includes('ハット')) return tags + ' #帽子 #UVカット #夏';
  return tags + ' #おすすめギフト #センスいいギフト';
}

function card(item, rank, sc) {
  const aff = affUrl(item.itemUrl);
  const price = parseInt(item.itemPrice);
  const avg = parseFloat(item.reviewAverage)||0;
  const cnt = parseInt(item.reviewCount)||0;
  const kw = keyword(item);
  const sn = Math.min(100,sc);
  const medImg = item.mediumImageUrls&&item.mediumImageUrls[0] ? (item.mediumImageUrls[0].imageUrl || item.mediumImageUrls[0]) : null;
  const cleanImg = item.mediumImageUrls ? item.mediumImageUrls.find(img=>{const u=img.imageUrl||img; return u.includes(`/0_mall/`);}) : null;
  const bestImg = cleanImg ? (cleanImg.imageUrl||cleanImg) : medImg;
  const imgHtml = medImg
    ? `<img class="pimg" src="${medImg}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="pimg-ph">🎁</div>`;

  const chatData = `【${rank}位】\n商品名（楽天表記）：${item.itemName.substring(0,40)}\n価格：¥${price.toLocaleString()}前後（税込）\n口コミ：\nポイント：${point(item)}\n検索ワード：${kw}\n商品画像：[添付してください]\n\n※商品名は10文字以内に変換してください\n※商品画像のテキスト・バナーは無視して商品本体のみ参考にしてください`;
  const genreLabel = document.getElementById("genre").options[document.getElementById("genre").selectedIndex].text;
  const roomData = JSON.stringify({genre:genreLabel,name:keyword(item),catch_:genCatch(item),features:genFeatures(item),tags:genTags(item)});
  const favData = encodeURIComponent(JSON.stringify({name:item.itemName,price,img:bestImg||medImg||'',url:aff,itemUrl:item.itemUrl,shop:item.shopName||''}));
  const isFaved = getFavs().some(f => f.itemUrl === item.itemUrl);

  return `<div class="card" data-chatgpt="${encodeURIComponent(chatData)}" data-room="${encodeURIComponent(roomData)}" data-itemurl="${encodeURIComponent(item.itemUrl||'')}" data-favdata="${favData}" data-aff="${encodeURIComponent(aff)}">
  <div class="card-ctrl">
    <button class="ctrl-btn fav-btn${isFaved?' fav-on':''}" onclick="toggleFav(this)" title="お気に入り">${isFaved?'❤️':'♡'}</button>
    <button class="ctrl-btn" onclick="moveCard(this,'up')" title="上へ">↑</button>
    <button class="ctrl-btn" onclick="moveCard(this,'down')" title="下へ">↓</button>
    <button class="ctrl-btn ctrl-del" onclick="deleteCard(this)" title="削除">削除</button>
  </div>
  <div class="card-head">
    <div class="badge b${rank}">${rank}</div>
    <div class="card-title-area">
      <div class="rank-lbl">${ICONS[rank]} ${rank}位 〈スコア${sn}〉</div>
      <div class="pname">${item.itemName}</div>
    </div>
    ${imgHtml}
  </div>
  <div class="card-body">
    <div class="price-row">
      <span class="price">¥${price.toLocaleString()}</span>
      <span class="price-lbl">税込</span>
      <span class="ok-badge">✓ 実在確認済</span>
    </div>
    ${avg>0?`<div class="review"><span class="stars">${stars(avg)}</span> ${avg.toFixed(1)} | ${cnt.toLocaleString()}件</div>`:''}
    <div class="score-row">
      <span class="score-lbl">選定スコア</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${sn}%"></div></div>
      <span class="score-val">${sn}</span>
    </div>
    <div class="point-box">💡 ${point(item)}</div>
    <div class="kw-lbl">📋 楽天検索キーワード（コピペ用）</div>
    <div class="kw-box">
      <span class="kw-text">${kw}</span>
      <button class="cp-btn" onclick="cp('${kw.replace(/'/g,"\\'")}',this)">コピー</button>
    </div>
    <div class="hint">🔍 「${item.shopName?item.shopName.substring(0,12):''}」を出品ショップで絞り込み / 価格：¥${price.toLocaleString()}付近</div>
    <div class="kw-lbl">🔗 アフィリエイトURL</div>
    <div class="kw-box">
      <span class="kw-text aff-url">${aff.substring(0,55)}...</span>
      <button class="cp-btn" onclick="cp('${aff.replace(/'/g,"\\'")}',this)">コピー</button>
      <a href="${aff}" target="_blank" style="flex-shrink:0;font-size:11px;padding:4px 10px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);text-decoration:none;white-space:nowrap;">開く↗</a>
    </div>
    ${bestImg||medImg ? `
    <div class="kw-lbl" style="margin-top:10px;">📸 商品画像</div>
    <div style="text-align:center;margin:6px 0 4px;">
      <img src="${bestImg||medImg}" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid #e8e0d4;background:#f9f5ee;" alt="商品画像" onerror="this.style.display='none'">
    </div>
    <div style="font-size:10px;color:#aaa;text-align:center;margin-bottom:8px;">※白背景優先で選択しています</div>` : ''}
    <button class="sns-btn" style="margin-top:8px;background:#1a1a2e;border-color:#4CAF50;color:#4CAF50;" onclick="cpChatGPT(this)">📋 ChatGPT用データをコピー</button>
    <button class="sns-btn" style="margin-top:6px;background:#1a1a2e;border-color:#1DA1F2;color:#1DA1F2;" onclick="cpX(this)">𝕏 X投稿文をコピー</button>
    <button class="sns-btn" style="margin-top:6px;background:#1a1a2e;border-color:#C9A84C;color:#C9A84C;" onclick="cpRoom(this)">🛍 楽天ルーム用説明文をコピー</button>
  </div>
</div>`;
}

async function run() {
  const btn = document.getElementById('searchBtn');
  const err = document.getElementById('err');
  const stats = document.getElementById('stats');
  const area = document.getElementById('area');
  const genre = document.getElementById('genre').value;
  const minP = document.getElementById('priceMin').value || 1;
  const maxP = document.getElementById('priceMax').value || 999999;
  const sort = document.getElementById('sort').value;
  const minAvg = document.getElementById('minAvg').value;
  const minCnt = document.getElementById('minCnt').value;
  const brand = document.getElementById('brand').value.trim();

  btn.disabled=true; btn.textContent='🔍 取得中...';
  err.classList.remove('on'); stats.classList.remove('on');
  area.innerHTML='<div class="empty"><div class="spinner"></div>楽天APIで実商品を取得・検証中...</div>';

  try {
    const params = new URLSearchParams({
      applicationId: APP_ID,
      affiliateId: AFF_ID,
      keyword: brand ? genre + ' ' + brand : genre,
      hits: 30,
      minPrice: minP,
      maxPrice: maxP,
      sort: sort,
      formatVersion: 2,
      imageFlag: 1
    });

    const res1 = await fetch(`/api/rakuten?${params}`);
    if (!res1.ok) throw new Error(`サーバーエラー (${res1.status})`);
    const data1 = await res1.json();
    if (data1.error) throw new Error(data1.error_description||data1.error);

    const params2 = new URLSearchParams({...Object.fromEntries(params), sort: '-reviewAverage'});
    const res2 = await fetch(`/api/rakuten?${params2}`);
    const data2 = res2.ok ? await res2.json() : {Items:[]};

    const rawItems = [...(data1.Items||[]), ...(data2.Items||[])];
    const items = rawItems.map(i => i.Item || i);
    if (!items.length) throw new Error('該当商品がありません。条件を変えてください。');

    const scored = items
      .map(i=>({item:i,sc:score(i,minAvg,minCnt)}))
      .filter(x=>x.sc>0)
      .sort((a,b)=>b.sc-a.sc)
      .filter((x,i,self)=>self.findIndex(y=>y.item.shopCode===x.item.shopCode)===i)
      .slice(0,5);

    if (scored.length<2) throw new Error(`バリデーション通過が${scored.length}件のみです。最低評価・レビュー数の条件を緩めてください。`);

    ranking = scored;
    const avgSc = Math.round(scored.reduce((s,x)=>s+x.sc,0)/scored.length);
    const avgPr = Math.round(scored.reduce((s,x)=>s+parseInt(x.item.itemPrice),0)/scored.length);
    document.getElementById('sTotal').textContent = items.length;
    document.getElementById('sValid').textContent = scored.length;
    document.getElementById('sScore').textContent = avgSc;
    document.getElementById('sPrice').textContent = '¥'+avgPr.toLocaleString();
    stats.classList.add('on');

    const rev = [...scored].reverse();
    let html = `<div class="sec-title">SNS用 ギフトランキング TOP${scored.length}</div>`;
    rev.forEach((x,i)=>{ html += card(x.item, scored.length-i, x.sc); });
    html += `<button class="sns-btn" onclick="openModal()">📱 SNS投稿テキストを一括生成</button>`;
    area.innerHTML = html;

  } catch(e) {
    err.textContent = '⚠️ '+e.message;
    err.classList.add('on');
    area.innerHTML = `<div class="empty">⚠️ ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='▶ 楽天APIで実商品ランキングを生成';
}

function cpX(btn) {
  const card = btn.closest('[data-chatgpt]');
  if (!card) return;
  const raw = decodeURIComponent(card.getAttribute('data-chatgpt'));
  const lines = raw.split('\n');
  const nameLine = lines.find(l => l.includes('商品名')) || '';
  const name = nameLine.replace('商品名（楽天表記）：','').trim().substring(0,20);
  const priceLine = lines.find(l => l.includes('価格')) || '';
  const price = priceLine.replace('価格：','').trim();
  const aff = card.dataset.aff ? decodeURIComponent(card.dataset.aff) : '';
  const n = name;

  let hook = '';
  if (n.includes('日傘')||n.includes('晴雨')) hook = '未来のシミ、作りたくない。🌂';
  else if (n.includes('日焼け止め')||n.includes('UVクリーム')||n.includes('サンスクリーン')) hook = '塗らないと、負ける。☀️';
  else if (n.includes('帽子')||n.includes('ハット')) hook = '頭から、老ける。🧢';
  else if (n.includes('化粧水')||n.includes('ローション')) hook = '10年後の肌、今日決まる。✨';
  else if (n.includes('美容液')||n.includes('セラム')) hook = 'スキンケア、まだ妥協してる？✨';
  else if (n.includes('冷感')||n.includes('ひんやり')) hook = 'この夏、暑さで消耗しないために。❄️';
  else if (n.includes('アイス')||n.includes('かき氷')) hook = '暑い日のご褒美、これ以外考えられない。🍧';
  else if (n.includes('虫除け')||n.includes('虫よけ')) hook = '刺されてから後悔しても遅い。🦟';
  else if (n.includes('サングラス')) hook = '目元から、紫外線にやられてる。🕶️';
  else if (n.includes('扇風機')||n.includes('サーキュレーター')) hook = 'エアコンだけじゃ、もったいない。🌀';
  else hook = 'これ知らないの、損してるよ。🎁';

  const text = `${hook}\n\n${name}\n${price}\n\n楽天で詳細を見る👇\n${aff}\n\n#楽天 #楽天ルーム #プレゼント迷子救済隊 #PR`;
  cp(text, btn);
}

function cpRoom(btn) {
  const card = btn.closest('div[data-room]');
  if (!card) { alert('エラー：データが見つかりません'); return; }
  const raw = card.getAttribute('data-room');
  if (!raw) { alert('エラー：data-roomがありません'); return; }
  try {
    const data = JSON.parse(decodeURIComponent(raw));
    const text = `📦 ${data.name}\n\n${data.catch_}\n\n✅ この商品が選ばれる理由\n${data.features}\n\n${data.tags}`;
    cp(text, btn);
  } catch(e) { alert('エラー：' + e.message); }
}

function cpChatGPT(btn) {
  const card = btn.closest('[data-chatgpt]');
  if (!card) return;
  const text = decodeURIComponent(card.getAttribute('data-chatgpt'));
  cp(text, btn);
}

const FAV_KEY = 'rakuten_favs';

function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; }
}

function saveFavs(favs) {
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
}

function updateFavCount() {
  const n = getFavs().length;
  document.getElementById('fav-fab').textContent = `❤️ お気に入り ${n}`;
}

function toggleFav(btn) {
  const card = btn.closest('.card');
  const itemUrl = decodeURIComponent(card.dataset.itemurl || '');
  let favs = getFavs();
  const idx = favs.findIndex(f => f.itemUrl === itemUrl);
  if (idx >= 0) {
    favs.splice(idx, 1);
    btn.classList.remove('fav-on');
    btn.textContent = '♡';
  } else {
    try {
      const data = JSON.parse(decodeURIComponent(card.dataset.favdata || '{}'));
      favs.push(data);
      btn.classList.add('fav-on');
      btn.textContent = '❤️';
    } catch(e) {}
  }
  saveFavs(favs);
  updateFavCount();
  if (document.getElementById('fav-section').classList.contains('on')) renderFavs();
}

function toggleFavSection() {
  const s = document.getElementById('fav-section');
  s.classList.toggle('on');
  if (s.classList.contains('on')) renderFavs();
}

function renderFavs() {
  const favs = getFavs();
  document.getElementById('fav-section-count').textContent = favs.length;
  const list = document.getElementById('fav-list');
  if (!favs.length) {
    list.innerHTML = '<div class="fav-empty">お気に入りはまだありません</div>';
    return;
  }
  list.innerHTML = favs.map((f, i) => `
    <div class="fav-card">
      ${f.img ? `<img class="fav-card-img" src="${f.img}" alt="" onerror="this.style.display='none'">` : '<div class="fav-card-img" style="display:flex;align-items:center;justify-content:center;font-size:22px;">🎁</div>'}
      <div class="fav-card-info">
        <div class="fav-card-name">${f.name.substring(0,50)}${f.name.length>50?'...':''}</div>
        <div class="fav-card-price">¥${f.price.toLocaleString()}</div>
        <div class="fav-card-actions">
          <a href="${f.url}" target="_blank" class="fav-card-link">楽天で見る↗</a>
          <button class="fav-card-del" onclick="removeFav(${i})">削除</button>
        </div>
      </div>
    </div>
  `).join('');
}

function removeFav(idx) {
  const favs = getFavs();
  const removed = favs.splice(idx, 1)[0];
  saveFavs(favs);
  updateFavCount();
  renderFavs();
  document.querySelectorAll('.card').forEach(card => {
    if (decodeURIComponent(card.dataset.itemurl||'') === removed.itemUrl) {
      const btn = card.querySelector('.fav-btn');
      if (btn) { btn.classList.remove('fav-on'); btn.textContent = '♡'; }
    }
  });
}

function clearAllFavs() {
  if (!confirm('お気に入りを全削除しますか？')) return;
  saveFavs([]);
  updateFavCount();
  renderFavs();
  document.querySelectorAll('.fav-btn.fav-on').forEach(btn => {
    btn.classList.remove('fav-on');
    btn.textContent = '♡';
  });
}

updateFavCount();

function cp(text, btn) {
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓ コピー済'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('done'); },1800);
  }).catch(()=>{
    const el=document.createElement('textarea'); el.value=text;
    document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
    btn.textContent='✓ コピー済'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='コピー'; btn.classList.remove('done'); },1800);
  });
}

function openModal() {
  if (!ranking.length) return;
  const genre = document.getElementById('genre').options[document.getElementById('genre').selectedIndex].text;
  let t = `🎁 おすすめランキング\n（${genre}）\n━━━━━━━━━━━━━━━━\n\n`;
  [...ranking].reverse().forEach((x,i)=>{
    const rank=ranking.length-i, item=x.item, price=parseInt(item.itemPrice);
    t+=`【${rank}位】${ICONS[rank]}\n${item.itemName.substring(0,28)}...\n💰 ¥${price.toLocaleString()}（税込）\n💡 ${point(item)}\n🔍 楽天検索：「${keyword(item)}」\n\n`;
  });
  t+=`━━━━━━━━━━━━━━━━\n詳細・購入リンクはプロフのリンクから👆\n#プレゼント #ギフト #楽天 #楽天ルーム\n#プレゼント迷子救済隊 #PR`;
  document.getElementById('snsText').value=t;
  document.getElementById('modal').classList.add('on');
}

function closeModal() { document.getElementById('modal').classList.remove('on'); }

function copyAll() {
  const t=document.getElementById('snsText').value;
  cp(t, document.querySelector('.copy-all'));
  document.querySelector('.copy-all').textContent='✓ コピーしました！';
  setTimeout(()=>{ document.querySelector('.copy-all').textContent='📋 全文コピー'; },2000);
}

function moveCard(btn, dir) {
  const card = btn.closest('.card');
  const area = document.getElementById('area');
  const cards = [...area.querySelectorAll('.card')];
  const idx = cards.indexOf(card);
  if (dir === 'up' && idx > 0) {
    area.insertBefore(card, cards[idx - 1]);
  } else if (dir === 'down' && idx < cards.length - 1) {
    cards[idx + 1].insertAdjacentElement('afterend', card);
  }
  updateRankBadges();
}

function deleteCard(btn) {
  const card = btn.closest('.card');
  card.remove();
  ranking.pop();
  updateRankBadges();
  const area = document.getElementById('area');
  if (!area.querySelector('.card')) {
    area.innerHTML = '<div class="empty"><div style="font-size:36px;margin-bottom:10px">🎁</div>条件を選んでボタンを押してください<br><small style="font-size:11px">楽天APIで実在商品のみ取得します</small></div>';
  }
}

function updateRankBadges() {
  const area = document.getElementById('area');
  const cards = [...area.querySelectorAll('.card')];
  const total = cards.length;
  const badgeClasses = ['','b1','b2','b3','b4','b5'];
  cards.forEach((card, i) => {
    const rank = i + 1;
    const badge = card.querySelector('.badge');
    const rankLbl = card.querySelector('.rank-lbl');
    if (badge) {
      badge.textContent = rank;
      badge.className = 'badge ' + (badgeClasses[rank] || 'b4');
    }
    if (rankLbl) {
      const icon = ICONS[rank] || '';
      const sc = rankLbl.textContent.match(/スコア(\d+)/);
      const scVal = sc ? sc[1] : '';
      rankLbl.textContent = `${icon} ${rank}位${scVal ? ` 〈スコア${scVal}〉` : ''}`;
    }
  });
}

async function searchByUrl() {
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('urlBtn');
  const urlErr = document.getElementById('urlErr');
  const resultsEl = document.getElementById('searchResults');
  const listEl = document.getElementById('srList');
  let url = input.value.trim();
  if (!url) { urlErr.textContent='URLを入力してください'; urlErr.classList.add('on'); return; }
  urlErr.classList.remove('on');
  btn.disabled = true; btn.textContent = '検索中...';
  if (url.includes('a.r10.to')) {
    try {
      const resolveRes = await fetch(`/api/resolve?url=${encodeURIComponent(url)}`);
      const resolveData = await resolveRes.json();
      if (resolveData.error) throw new Error(resolveData.error);
      if (resolveData.finalUrl) url = resolveData.finalUrl;
    } catch(e) {
      urlErr.textContent = '短縮URLの解決に失敗しました。楽天市場の商品ページURL（item.rakuten.co.jp/...）またはアフィリエイトURL（hb.afl.rakuten...）を貼り付けてください';
      urlErr.classList.add('on');
      btn.disabled = false; btn.textContent = '検索';
      return;
    }
  }
  try {
    if (url.includes('hb.afl.rakuten') || url.includes('hgc/')) {
      const pcMatch = url.match(/pc=([^&]+)/);
      if (pcMatch) url = decodeURIComponent(decodeURIComponent(pcMatch[1]));
    }
  } catch(e) {}
  let shopCode = '', itemCode = '';
  const match = url.match(/item\.rakuten\.co\.jp\/([^\/]+)\/([^\/\?]+)/);
  if (match) { shopCode = match[1]; itemCode = match[2]; }
  listEl.innerHTML = '<div style="text-align:center;padding:16px;color:#aaa;"><div class="spinner" style="margin:0 auto 8px;"></div>取得中...</div>';
  resultsEl.classList.add('on');
  try {
    let items = [];

    if (shopCode && itemCode) {
      const params = new URLSearchParams({ itemCode: shopCode+':'+itemCode, hits:10, format:'json', imageFlag:1 });
      const res = await fetch(`/api/rakuten?${params}`);
      const data = await res.json();
      if (!data.error) items = (data.Items || []).map(i => i.Item || i);
    }

    if (!items.length) {
      let keyword = '';
      try {
        const titleRes = await fetch(`/api/pagetitle?url=${encodeURIComponent(url)}`);
        const titleData = await titleRes.json();
        keyword = (titleData.title || '').split(/[|｜]/)[0].trim();
      } catch(e) {}
      if (!keyword) {
        const kwMatch = url.match(/keyword=([^&]+)/);
        keyword = kwMatch ? decodeURIComponent(kwMatch[1]) : '';
      }
      if (!keyword) throw new Error('URLから商品情報を取得できませんでした');
      const params2 = new URLSearchParams({ keyword, hits:10, sort:'-reviewCount', format:'json', imageFlag:1 });
      const res2 = await fetch(`/api/rakuten?${params2}`);
      const data2 = await res2.json();
      if (data2.error) throw new Error(data2.error_description || data2.error);
      items = (data2.Items || []).map(i => i.Item || i);
    }

    if (!items.length) throw new Error('該当商品が見つかりませんでした');
    listEl.innerHTML = items.map((item, idx) => {
      const medImg = item.mediumImageUrls&&item.mediumImageUrls[0] ? (item.mediumImageUrls[0].imageUrl||item.mediumImageUrls[0]) : null;
      const imgHtml = medImg ? `<img class="sr-img" src="${medImg}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<div class="sr-img-ph">🎁</div>`;
      const avg = parseFloat(item.reviewAverage)||0;
      const cnt = parseInt(item.reviewCount)||0;
      const price = parseInt(item.itemPrice)||0;
      return `<div class="sr-card" id="sr-${idx}">${imgHtml}<div class="sr-info"><div class="sr-name">${item.itemName}</div><div class="sr-price">¥${price.toLocaleString()}</div>${avg>0?`<div class="sr-review"><span style="color:var(--gold)">${stars(avg)}</span> ${avg.toFixed(1)} | ${cnt.toLocaleString()}件</div>`:''}</div><button class="add-btn" onclick="addToRanking(${idx})">追加</button></div>`;
    }).join('');
    window._srItems = items;
  } catch(e) {
    urlErr.textContent = '⚠️ ' + e.message;
    urlErr.classList.add('on');
    listEl.innerHTML = '';
    resultsEl.classList.remove('on');
  }
  btn.disabled = false; btn.textContent = '検索';
}

async function searchKeyword() {
  const input = document.getElementById('kwInput');
  const btn = document.getElementById('kwBtn');
  const kwErr = document.getElementById('kwErr');
  const resultsEl = document.getElementById('searchResults');
  const listEl = document.getElementById('srList');
  const kw = input.value.trim();

  if (!kw) { kwErr.textContent='キーワードを入力してください'; kwErr.classList.add('on'); return; }
  kwErr.classList.remove('on');
  btn.disabled = true; btn.textContent = '検索中...';
  listEl.innerHTML = '<div style="text-align:center;padding:16px;color:#aaa;"><div class="spinner" style="margin:0 auto 8px;"></div>取得中...</div>';
  resultsEl.classList.add('on');

  try {
    const params = new URLSearchParams({
      keyword: kw,
      hits: 10,
      sort: '-reviewCount',
      format: 'json',
      imageFlag: 1,
    });
    const res = await fetch(`/api/rakuten?${params}`);
    if (!res.ok) throw new Error(`サーバーエラー (${res.status})`);
    const data = await res.json();
    if (data.error) throw new Error(data.error_description || data.error);
    const items = (data.Items || []).map(i => i.Item || i);
    if (!items.length) throw new Error('該当商品が見つかりませんでした');

    listEl.innerHTML = items.map((item, idx) => {
      const medImg = item.mediumImageUrls && item.mediumImageUrls[0] ? (item.mediumImageUrls[0].imageUrl || item.mediumImageUrls[0]) : null;
      const imgHtml = medImg
        ? `<img class="sr-img" src="${medImg}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="sr-img-ph">🎁</div>`;
      const avg = parseFloat(item.reviewAverage) || 0;
      const cnt = parseInt(item.reviewCount) || 0;
      const price = parseInt(item.itemPrice) || 0;
      const nameSafe = item.itemName.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      return `<div class="sr-card" id="sr-${idx}">
        ${imgHtml}
        <div class="sr-info">
          <div class="sr-name">${item.itemName}</div>
          <div class="sr-price">¥${price.toLocaleString()}</div>
          ${avg > 0 ? `<div class="sr-review"><span style="color:var(--gold)">${stars(avg)}</span> ${avg.toFixed(1)} | ${cnt.toLocaleString()}件</div>` : ''}
        </div>
        <button class="add-btn" onclick="addToRanking(${idx})">追加</button>
      </div>`;
    }).join('');

    window._srItems = items;

  } catch(e) {
    kwErr.textContent = '⚠️ ' + e.message;
    kwErr.classList.add('on');
    listEl.innerHTML = '';
    resultsEl.classList.remove('on');
  }
  btn.disabled = false; btn.textContent = '検索';
}

function addToRanking(idx) {
  const item = window._srItems && window._srItems[idx];
  if (!item) return;

  const btn = document.querySelector(`#sr-${idx} .add-btn`);
  const sc = score(item, 0, 0);
  const safeScore = sc > 0 ? sc : 30;

  const area = document.getElementById('area');
  const emptyEl = area.querySelector('.empty');
  if (emptyEl) area.innerHTML = `<div class="sec-title">SNS用 ギフトランキング</div>`;

  const newRank = ranking.length + 1;
  ranking.push({ item, sc: safeScore });

  const cardHtml = card(item, newRank, safeScore);
  const secTitle = area.querySelector('.sec-title');
  const snsBtn = area.querySelector('.sns-btn[onclick="openModal()"]');

  const tmp = document.createElement('div');
  tmp.innerHTML = cardHtml;
  const newCard = tmp.firstElementChild;

  if (snsBtn) {
    area.insertBefore(newCard, snsBtn);
  } else {
    area.appendChild(newCard);
    const allBtn = document.createElement('button');
    allBtn.className = 'sns-btn';
    allBtn.setAttribute('onclick', 'openModal()');
    allBtn.textContent = '📱 SNS投稿テキストを一括生成';
    area.appendChild(allBtn);
  }

  if (btn) { btn.textContent = '追加済'; btn.classList.add('added'); btn.disabled = true; }
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
