name: Rakuten API probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rakuten-probe.yml'
      - 'scripts/probe.js'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe.js
